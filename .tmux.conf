# =========================
# GENERAL SETTINGS
# =========================

# Enable mouse support
set -g mouse on
# Increase message display time (ms)
set -g display-time 3000
# Faster key response
set -sg escape-time 10


# =========================
# PREFIX KEY
# =========================

set -g prefix C-s
bind C-s send-prefix


# =========================
# WINDOWS & PANES
# =========================

# Start indexing from 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Split panes (preserve current path)
bind | split-window -h -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'

# Alternate splits (default behavior)
bind \\ split-window -h
bind -  split-window -v

# Remove default bindings
unbind '"'
unbind %

# Navigate panes (Alt + arrows, no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Kill pane (no confirmation)
bind x kill-pane

# detach
bind C-X detach


# =========================
# SESSION MANAGEMENT
# =========================

# Interactive session/window switcher
bind-key s choose-tree -Zs


# =========================
# CONFIG RELOAD
# =========================

bind-key R source-file ~/.tmux.conf \; display-message "configuration reloaded succesfully"


# =========================
# STATUS BAR
# =========================

# Position & base styling
set -g status-position bottom # top
set -g status-justify centre
set -g status-style bg=#0f1117,fg=#a9b1d6

# Left: session name
set -g status-left "#[fg=#7aa2f7,bold]  #S "

# Right: time + host
set -g status-right "#[fg=#9ece6a]%H:%M #[fg=#565f89]| #[fg=#e0af68]#H "

# Toggle status bar with SPACE key
bind-key Space set-option status


# -------------------------
# Window tabs
# -------------------------

# Inactive
set -g window-status-format "#[fg=#7aa2f7]#I#[fg=#565f89] #[fg=#a9b1d6]#W "
# Active
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I #[fg=#7aa2f7,bg=#292e42] #W #[default]"

# Activity / bell indicators
set -g window-status-activity-style fg=#e0af68
set -g window-status-bell-style     fg=#f7768e,bold


# -------------------------
# Pane borders
# -------------------------

set -g pane-border-style        fg=#2f3549
set -g pane-active-border-style fg=#7aa2f7


# =========================
# WINDOW MANAGEMENT
# =========================

# Force manual naming when creating a new window
bind-key c new-window \; command-prompt -p "Window name:" "rename-window '%%'"


# =========================
# POPUPS
# =========================

# System monitor popup (centered)
bind-key h display-popup -E \
    -w 80% -h 80% \
    -x C -y C \
    -T "System Monitor" \
    "htop"

# System configs
bind d display-menu -T "#[align=center]Dotfiles" -x C -y C                           \
	"  tmux"    t "display-popup -w 90% -h 90% -E 'nvim ~/.tmux.conf'"                 \
	"  kitty"   k "display-popup -w 90% -h 90% -E 'nvim ~/.config/kitty/kitty.conf'"   \
	"  nvim"    n "display-popup -w 90% -h 90% -E 'nvim ~/.config/nvim'"              \
	"  bash"    b "display-popup -w 90% -h 90% -E 'nvim ~/.bashrc'"                   \
	"󰘳  alias"   a "display-popup -w 90% -h 90% -E 'nvim ~/.bash_aliases'"             \
	"󰓅  system monitor" w "display-popup -w 90% -h 90% -E 'btop'" \
	"󰗼  quit"    q ""


# =========================
# COPY MODE (vim)
# =========================
# Use vim keybindings in copy mode
set -g mode-keys vi

# Enter copy mode with prefix + v (or default: prefix + [)
bind v copy-mode

# Visual selection + yank like vim
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi Y   send -X copy-end-of-line

# Vim-style search in copy mode (/ and ? already work by default)
# Scroll
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi C-u send -X halfpage-up
# pipe to system clipboard (xsel, xclip for x11 | wl-copy for wayland)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"


# =========================
# PLUGINS
# =========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
